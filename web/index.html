<html>
    <head>
        <title>WEB OMAR CIHUYYYYY</title>
    </head>
    <body>
        <h1>Ini Website Robin</h1>
        <button onclick="getRequest()">GET</button>
        <button onclick="postRequest()">POST</button>
        <input id="xml_file" type="file" accept=".xml,text/xml,application/xml">
        <button onclick="uploadXml()">UPLOAD XML</button>
        <div id="response_print"></div>
        <p>Server is running on <strong>10.34.211.178:8000</strong></p>

        <script>
            const API_URL = "https://10.34.211.178";
            const API_PORT = "8000"

            async function getRequest() {
                var result = ""

                try {
                    const response = await fetch(`${API_URL}:${API_PORT}/`, {
                        method: "GET",
                        headers: {
                            "Accept": "application/json"
                        }
                    });

                    console.log("Response headers:");
                    for (const [name, value] of response.headers.entries()) {
                        console.log(`${name}: ${value}`);
                    }

                    result = await response.text();
                    
                } catch (err) {
                    result = JSON.stringify({
                        "success": false,
                        "message": `client error : ${err}`
                    }, null, 2)
                }

                document.getElementById("response_print").innerHTML = `<pre>${result}</pre>`
            }

            async function postRequest() {
                var result = ""
                const requestBody = "P".repeat(4000)

                try {
                    const response = await fetch(`${API_URL}:${API_PORT}/123`, {
                        method: "POST",
                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "text/plain"
                        },
                        body: requestBody
                    });

                    result = await response.text()
                } catch (err) {
                    result = JSON.stringify({
                        "success": false,
                        "message": `client error : ${err}`
                    }, null, 2)
                }

                document.getElementById("response_print").innerHTML = `<pre>${result}</pre>`
            }

            async function uploadXml() {
                const file = document.getElementById("xml_file").files[0]

                if (!file) {
                    document.getElementById("response_print").innerHTML = "<pre>Select an XML file first.</pre>"
                    return
                }

                try {
                    await fetch(`${API_URL}:${API_PORT}/upload`, {
                        method: "POST",
                        mode: "no-cors",
                        headers: {
                            "Content-Type": "text/plain"
                        },
                        body: file
                    });

                    document.getElementById("response_print").innerHTML =
                        `<pre>Sent ${file.name} (${file.size} bytes)</pre>`
                } catch (err) {
                    document.getElementById("response_print").innerHTML =
                        `<pre>Upload failed: ${err}</pre>`
                }
            }
        </script>
    </body>
</html>
