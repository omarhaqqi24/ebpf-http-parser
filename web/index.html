<html>
    <head>
        <title>WEB OMAR CIHUYYYYY</title>
    </head>
    <body>
        <h1>Ini Website Omar</h1>
        <button onclick="getRequest()">GET</button>
        <button onclick="postRequest()">POST</button>
        <div id="response_print"></div>

        <script>
            const API_URL = "http://10.34.211.178";
            const API_PORT = "8000"

            async function getRequest() {
                var result = ""

                try {
                    const response = await fetch(`${API_URL}:${API_PORT}/`, {
                        method: "GET",
                        headers: {
                            "Accept": "application/json"
                        }
                    });

                    console.log("Response headers:");
                    for (const [name, value] of response.headers.entries()) {
                        console.log(`${name}: ${value}`);
                    }

                    const data = await response.json();
                    result = JSON.stringify(data, null, 2)
                    
                } catch (err) {
                    result = JSON.stringify({
                        "success": false,
                        "message": `client error : ${err}`
                    }, null, 2)
                }

                document.getElementById("response_print").innerHTML = `<pre>${result}</pre>`
            }

            async function postRequest() {
                var result = ""
                const requestBody = "P".repeat(4000)

                try {
                    const response = await fetch(`${API_URL}:${API_PORT}/123`, {
                        method: "POST",
                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "text/plain"
                        },
                        body: requestBody
                    });

                    const data = await response.json()
                    result = JSON.stringify(data, null, 2)
                } catch (err) {
                    result = JSON.stringify({
                        "success": false,
                        "message": `client error : ${err}`
                    }, null, 2)
                }

                document.getElementById("response_print").innerHTML = `<pre>${result}</pre>`
            }
        </script>
    </body>
</html>
